version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/MedDx-hack
permissions:
  - object: /home/ec2-user/MedDx-hack/scripts
    pattern: "*.sh"
    owner: root
    mode: 755
    type:
      - file
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
